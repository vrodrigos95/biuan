name: Publicar

# Pruebas: compila la app y la publica en la rama gh-pages (GitHub Pages).
# Producción: arma el paquete para Hostinger y lo deja para descargar en la pestaña Actions.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir a gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Paquete para Hostinger
        run: npm run build:produccion
      - uses: actions/upload-artifact@v4
        with:
          name: biuan-hostinger
          path: produccion/
          include-hidden-files: true
          retention-days: 30
